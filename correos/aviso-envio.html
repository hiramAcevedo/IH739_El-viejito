<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tu pedido #{{ folio }} va en camino</title></head>
<body style="margin:0;padding:0;background:#f5f0e8;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f0e8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#1a1a1a;padding:20px 32px;">
          <span style="font-family:Georgia,serif;font-size:24px;font-weight:bold;color:#c9a84c;">El Viejito</span>
          <span style="font-size:11px;letter-spacing:3px;color:#f5f0e8;display:block;">TEQUILA</span>
        </td></tr>
        <tr><td style="padding:32px 32px 8px;">
          <p style="margin:0 0 8px;font-size:15px;color:#555555;">Folio de tu pedido</p>
          <p style="margin:0;font-family:'Courier New',monospace;font-size:34px;font-weight:bold;letter-spacing:2px;">#{{ folio }}</p>
          <h1 style="font-family:Georgia,serif;font-size:26px;margin:24px 0 8px;">Tu pedido va en camino, {{ nombre }}</h1>
        </td></tr>
        <tr><td style="padding:8px 32px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f0e8;border:1px solid #e5e0d5;border-radius:8px;">
            <tr><td style="padding:16px 20px;font-size:14px;color:#555555;">Paquetería<br><strong style="font-size:16px;color:#1a1a1a;">{{ paqueteria }}</strong></td></tr>
            <tr><td style="padding:0 20px 16px;font-size:14px;color:#555555;">Número de guía<br><strong style="font-family:'Courier New',monospace;font-size:20px;color:#1a1a1a;">{{ guia }}</strong></td></tr>
            <tr><td style="padding:0 20px 16px;font-size:14px;color:#555555;">Entrega estimada<br><strong style="font-size:16px;color:#1a1a1a;">{{ fecha_estimada }}</strong></td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:24px 32px 32px;">
          <a href="{{ liga_seguimiento }}" style="display:block;text-align:center;background:#c9a84c;color:#1a1a1a;text-decoration:none;font-weight:bold;font-size:16px;padding:14px;border-radius:6px;">Seguir mi pedido</a>
        </td></tr>
        <tr><td style="background:#f5f0e8;padding:20px 32px;font-size:12px;line-height:1.6;color:#555555;">
          <strong style="color:#1a1a1a;">{{ leyenda }}</strong><br>
          Tequila El Viejito · Tototlán, Jalisco · contacto@elviejito.com
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
